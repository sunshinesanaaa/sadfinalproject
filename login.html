<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Golden Glow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  body { display: flex; min-height: 100vh; flex-direction: column; }
  .auth-shell { flex: 1; display: grid; grid-template-columns: 1fr 1fr; }

  .auth-side {
    background: var(--navy-deep);
    background-image: radial-gradient(ellipse at 80% 15%, rgba(217,190,121,0.12), transparent 55%);
    color: var(--ivory);
    padding: 56px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .auth-side .brand-word { font-size: 20px; }
  .auth-side blockquote {
    font-family: var(--serif); font-size: 26px; line-height: 1.5; font-weight: 500;
    max-width: 26ch; margin: 0;
  }
  .auth-side cite { font-style: normal; color: var(--gold-soft); font-size: 13px; display: block; margin-top: 14px; }

  .auth-form-wrap {
    display: flex; align-items: center; justify-content: center; padding: 56px 40px;
  }
  .auth-form { width: 100%; max-width: 380px; }

  .auth-tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 30px; }
  .auth-tabs button {
    flex: 1; background: none; border: none; padding: 0 0 14px; font-size: 14.5px; font-weight: 600;
    color: var(--text-soft); cursor: pointer; border-bottom: 2px solid transparent;
  }
  .auth-tabs button.active { color: var(--navy); border-color: var(--gold); }

  .auth-form h1 { font-size: 24px; margin-bottom: 6px; }
  .auth-form > p.sub { color: var(--text-soft); font-size: 13.5px; margin: 0 0 26px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--radius-s);
    font-size: 14px; color: var(--text);
  }
  .field input:focus { outline: none; border-color: var(--gold); }

  .field-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .remember { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-soft); }
  .remember input { accent-color: var(--gold); }
  .forgot { font-size: 13px; color: var(--navy); text-decoration: none; border-bottom: 1px solid var(--gold); }

  .divider { display: flex; align-items: center; gap: 12px; margin: 26px 0; color: var(--text-soft); font-size: 12.5px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .role-note { font-size: 12.5px; color: var(--text-soft); text-align: center; margin-top: 20px; }
  .role-note b { color: var(--navy); }

  @media (max-width: 860px) {
    .auth-shell { grid-template-columns: 1fr; }
    .auth-side { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <img src="assets/gglogo.png" alt="Golden Glow">
      <span class="brand-word">Golden <b>Glow</b></span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="index.html#story">Our Story</a>
      <a href="index.html#story">Contact</a>
    </nav>
    <div class="top-actions">
      <a href="cart.html" class="icon-link" title="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="cart-count">3</span>
      </a>
    </div>
  </div>
</div>

<div class="auth-shell">
  <div class="auth-side">
    <a href="index.html" class="brand"><img src="assets/gglogo.png" alt="Golden Glow"><span class="brand-word">Golden <b>Glow</b></span></a>
    <blockquote>"Skin that remembers its own light."<cite>Golden Glow Skincare</cite></blockquote>
    <div></div>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-form">
      <div class="auth-tabs">
        <button type="button" class="active">Sign in</button>
        <button type="button">Create account</button>
      </div>

      <h1>Welcome back</h1>
      <p class="sub">Sign in to check order status and manage your details.</p>

      <form onsubmit="return false;">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password">
        </div>
        <div class="field-row">
          <label class="remember"><input type="checkbox"> Remember me</label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-gold btn-block">Sign in</button>
      </form>

      <div class="divider">or</div>

      <p class="role-note">Admin accounts land on the <b>dashboard</b>. Customer accounts return to <b>shop</b>.</p>
    </div>
  </div>
</div>

</body>
</html>
