<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Header with Product Grid</title>
  <style>
    body { margin:0; font-family:Arial, sans-serif; }

    /* Top Bar */
    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      background:#f9e79f; padding:10px 20px;
    }
    .logo { font-weight:bold; font-size:18px; margin-right:auto; }
    .search-bar { margin-left:30px; }
    .search-bar input { width:220px; padding:6px 12px; border:1px solid #ccc; border-radius:20px; }
    .nav-links { display:flex; align-items:center; gap:20px; margin-left:20px; }
    .nav-links a { text-decoration:none; color:#333; font-weight:500; }
    .nav-links a:hover { color:#1abc9c; }
    .dropdown { position:relative; }
    .dropdown .dropbtn::after { content:" ▼"; font-size:12px; }
    .dropdown-content { display:none; position:absolute; top:100%; left:0; background:#fff; min-width:150px; box-shadow:0 4px 6px rgba(0,0,0,0.1); }
    .dropdown-content a { display:block; padding:10px; text-decoration:none; color:#333; }
    .dropdown-content a:hover { background:#f1f1f1; }
    .dropdown.active .dropdown-content { display:block; }
    .cart { font-size:20px; cursor:pointer; }

    /* Product Grid */
    .product-grid { padding:20px; }
    .row { display:flex; flex-wrap:wrap; gap:20px; margin-bottom:20px; }
    .product-card {
      width:200px; border:1px solid #ccc; border-radius:10px;
      padding:15px; text-align:center; background:#fff;
      box-shadow:0 2px 6px rgba(0,0,0,0.1); transition:transform 0.2s;
    }
    .product-card:hover { transform:scale(1.05); }
    .product-card img { width:100%; height:120px; object-fit:cover; border-radius:6px; margin-bottom:10px; }
    .product-card h4 { margin:8px 0 4px; font-size:16px; color:#333; }
    .product-card p { margin:4px 0; font-size:13px; color:#555; }

    /* Admin Controls Container */
    .controls-container {
      border:2px solid #ccc; border-radius:10px; padding:20px;
      margin-top:20px; background:#fdfdfd; box-shadow:0 2px 6px rgba(0,0,0,0.1);
      max-width:500px;
    }
    .controls-container h3 { margin:0 0 15px; font-size:18px; text-align:center; }
    .controls-container input, .controls-container select {
      display:block; width:95%; padding:8px; margin:8px auto;
      border:1px solid #ccc; border-radius:6px;
    }
    .controls-container button {
      padding:8px 14px; margin:8px 5px; border:none; border-radius:6px;
      background:#1abc9c; color:#fff; cursor:pointer; transition:background 0.2s;
    }
    .controls-container button:hover { background:#16a085; }
    .remove-btn { background:#e74c3c; }
    .remove-btn:hover { background:#c0392b; }

    /* Account Notification Modal */
    .modal {
      display:none; position:fixed; z-index:1000;
      left:0; top:0; width:100%; height:100%;
      background:rgba(0,0,0,0.5);
    }
    .modal-content {
      background:#fff; margin:15% auto; padding:20px;
      border-radius:8px; width:300px; text-align:center;
      box-shadow:0 2px 6px rgba(0,0,0,0.2);
    }
    .modal-content h3 { margin-top:0; }
    .close {
      float:right; font-size:20px; cursor:pointer;
    }

    /* Footer */
    .site-footer {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background-color: #333; color: #fff; text-align: center;
      padding: 12px 0; font-size: 14px; box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
    }
    .site-footer p { margin: 4px 0; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">Logo section</div>
    <div class="search-bar"><input type="text" placeholder="search..."></div>
    <div class="nav-links">
      <a href="#about">About Us</a>
      <div class="dropdown" id="productsDropdown">
        <a href="#products" class="dropbtn">Products</a>
        <div class="dropdown-content">
          <a href="#product1">Product 1</a>
          <a href="#product2">Product 2</a>
          <a href="#product3">Product 3</a>
        </div>
      </div>
      <a href="#account" onclick="accountNotification()">Account</a>
      <span class="cart" title="Cart">🛒</span>
    </div>
  </div>

  <!-- Account Notification Modal -->
  <div id="accountModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h3>Account Settings</h3>
      <p>Please log in to access admin features.</p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="product-grid">
    <h2>Products</h2>
    <div id="grid" class="row"></div>

    <!-- Admin Controls grouped in a container -->
    <div class="controls-container" id="adminControls" style="display:none;">
      <h3>Admin Product Controls</h3>
      <input type="text" id="productName" placeholder="Enter product name">
      <input type="text" id="productImage" placeholder="Enter image URL">
      <input type="number" id="productPrice" placeholder="Enter price">
      <input type="number" id="productQty" placeholder="Enter quantity">
      <select id="productType">
        <option value="">Select type</option>
        <option value="Electronics">Electronics</option>
        <option value="Clothing">Clothing</option>
        <option value="Food">Food</option>
        <option value="Accessories">Accessories</option>
      </select>
      <button onclick="addProduct()">Add Product</button>
      <button class="remove-btn" onclick="removeProduct()">Remove Last Product</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>© 2006 Your Company Name</p>
    <p>Find us at: Facebook | Twitter | Instagram | Email</p>
  </footer>

  <script>
    let currentUserRole = null; // no one logged in yet

    function accountNotification() {
      document.getElementById("accountModal").style.display = "block";
    }
    function closeModal() {
      document.getElementById("accountModal").style.display = "none";
    }

    // Dropdown toggle
    const productsDropdown = document.getElementById("productsDropdown");
    const dropbtn = productsDropdown.querySelector(".dropbtn");
    dropbtn.addEventListener("click", function(e) {
      e.preventDefault();
      productsDropdown.classList.toggle("active");
    });
    document.addEventListener("click", function(e) {
      if (!productsDropdown.contains(e.target)) {
        productsDropdown.classList.remove("active");
      }
    });

    // Add/remove products dynamically
    function addProduct() {
      if (currentUserRole !== "admin") {
        alert("Only admin can add products.");
        return;
      }
      const name = document.getElementById("productName").value;
      const url = document.getElementById("productImage").value;
      const price = document.getElementById("productPrice").value;
      const qty = document.getElementById("productQty").value;
      const type = document.getElementById("productType").value;

      if (name && url && price && qty && type) {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <img src="${url}" alt="${name}">
                    <h4>${name}</h4>
          <p>Type: ${type}</p>
          <p>Price: ₱${price}</p>
          <p>Quantity: ${qty}</p>
        `;
        document.getElementById("grid").appendChild(card);

        // Clear inputs
        document.getElementById("productName").value = "";
        document.getElementById("productImage").value = "";
        document.getElementById("productPrice").value = "";
        document.getElementById("productQty").value = "";
        document.getElementById("productType").value = "";
      } else {
        alert("Please fill in all fields.");
      }
    }

    function removeProduct() {
      if (currentUserRole !== "admin") {
        alert("Only admin can remove products.");
        return;
      }
      const grid = document.getElementById("grid");
      if (grid.lastChild) {
        grid.removeChild(grid.lastChild);
      } else {
        alert("No products to remove.");
      }
    }
  </script>
</body>
</html>
