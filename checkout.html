<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Golden Glow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/style.css">

    <style>
        .checkout-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .checkout-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .checkout-title h1 {
            font-family: var(--serif);
            font-size: 42px;
            margin-bottom: 10px;
        }

        .checkout-title p {
            color: var(--text-soft);
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
        }

        .checkout-card {
            background: white;
            border: 1px solid var(--line);
            border-radius: var(--radius-m);
            padding: 28px;
            margin-bottom: 24px;
        }

        .checkout-card h2 {
            font-family: var(--serif);
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .payment-option input {
            width: auto;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item-name {
            font-weight: 600;
        }

        .order-item-price {
            white-space: nowrap;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        .summary-total {
            font-size: 20px;
            font-weight: 700;
            padding-top: 18px;
            margin-top: 18px;
            border-top: 1px solid var(--line);
        }

        @media (max-width: 800px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">

            <a href="index.html" class="brand">
                <img src="assets/gglogo.png" alt="Golden Glow Logo">
                <span>Golden Glow</span>
            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="#">Our Story</a>
                <a href="#">Contact</a>
                <a href="cart.html">Cart</a>
            </nav>

        </div>
    </header>

    <main class="checkout-page">

        <div class="checkout-title">
            <h1>Checkout</h1>
            <p>Complete your details to place your Golden Glow order.</p>
        </div>

        <div class="checkout-grid">

            <div>

                <div class="checkout-card">
                    <h2>Customer Information</h2>

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number">
                    </div>

                    <div class="form-group">
                        <label for="address">Delivery Address</label>
                        <textarea id="address" placeholder="Enter your complete delivery address"></textarea>
                    </div>

                </div>

                <div class="checkout-card">
                    <h2>Payment Method</h2>

                    <label class="payment-option">
                        <input type="radio" name="payment" checked>
                        Cash on Delivery
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment">
                        GCash
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment">
                        Credit / Debit Card
                    </label>

                </div>

            </div>

            <div>

                <div class="checkout-card">
                    <h2>Order Summary</h2>

                    <div class="order-item">
                        <div class="order-item-name">
                            Golden Glow Repair Serum
                        </div>
                        <div class="order-item-price">
                            ₱899
                        </div>
                    </div>

                    <div class="order-item">
                        <div class="order-item-name">
                            Radiance Cleansing Foam
                        </div>
                        <div class="order-item-price">
                            ₱698
                        </div>
                    </div>

                    <div class="order-item">
                        <div class="order-item-name">
                            Even-Tone Day Lotion
                        </div>
                        <div class="order-item-price">
                            ₱459
                        </div>
                    </div>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>₱2,056</span>
                    </div>

                    <div class="summary-row">
                        <span>Shipping</span>
                        <span>₱99</span>
                    </div>

                    <div class="summary-row summary-total">
                        <span>Total</span>
                        <span>₱2,155</span>
                    </div>

                    <button class="btn btn-gold btn-block" style="margin-top: 22px;">
                        Place Order
                    </button>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
