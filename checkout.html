<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Golden Glow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">

            <a href="index.html" class="brand">
                <img src="assets/gglogo.png" alt="Golden Glow Logo">
                <span>Golden Glow</span>
            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="#">Our Story</a>
                <a href="#">Contact</a>
                <a href="cart.html">Cart</a>
            </nav>

        </div>
    </header>

    <main class="checkout-page">

        <div class="checkout-title">
            <h1>Checkout</h1>
            <p>Complete your details to place your Golden Glow order.</p>
        </div>

        <div class="checkout-grid">

            <div>

                <div class="checkout-card">
                    <h2>Customer Information</h2>

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number">
                    </div>

                    <div class="form-group">
                        <label for="address">Delivery Address</label>
                        <textarea id="address" placeholder="Enter your complete delivery address"></textarea>
                    </div>

                </div>

                <div class="checkout-card">
                    <h2>Payment Method</h2>

                    <label class="payment-option">
                        <input type="radio" name="payment" checked>
                        Cash on Delivery
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment">
                        GCash
                    </label>

                    <label class="payment-option">
                        <input type="radio" name="payment">
                        Credit / Debit Card
                    </label>

                </div>

            </div>

            <div>

                <div class="checkout-card">
                    <h2>Order Summary</h2>

                    <div class="order-item">
                        <div class="order-item-name">
                            Golden Glow Repair Serum
                        </div>
                        <div class="order-item-price">
                            ₱899
                        </div>
                    </div>

                    <div class="order-item">
                        <div class="order-item-name">
                            Radiance Cleansing Foam
                        </div>
                        <div class="order-item-price">
                            ₱698
                        </div>
                    </div>

                    <div class="order-item">
                        <div class="order-item-name">
                            Even-Tone Day Lotion
                        </div>
                        <div class="order-item-price">
                            ₱459
                        </div>
                    </div>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>₱2,056</span>
                    </div>

                    <div class="summary-row">
                        <span>Shipping</span>
                        <span>₱99</span>
                    </div>

                    <div class="summary-row summary-total">
                        <span>Total</span>
                        <span>₱2,155</span>
                    </div>

                    <button class="btn btn-gold btn-block place-order-button">
                        Place Order
                    </button>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
