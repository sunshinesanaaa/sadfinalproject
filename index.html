<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Glow</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('ggprod.png') no-repeat center center fixed;
      background-size: cover;
    }

    /* Dark Overlay with Blur */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); /* darker neutral overlay */
      backdrop-filter: blur(6px);      /* blur effect */
      -webkit-backdrop-filter: blur(6px); /* Safari support */
      z-index: -1;
    }


    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(249, 231, 159, 0.9);
      padding: 10px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 45px;
      width: auto;
    }

    .logo-text {
      font-size: 22px;
      font-weight: bold;
      color: #23468C; /* brand blue only here */
      letter-spacing: 1px;
    }

    .search-bar input {
      width: 220px;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: #23468C; /* hover accent */
    }

    .cart {
      font-size: 20px;
      cursor: pointer;
    }

    /* Hero Section */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 70vh;
      text-align: center;
    }

    .hero h1 {
      font-size: 48px;
      color: #fff; /* white text for contrast */
      margin-bottom: 20px;
    }

    .hero button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      background: #23468C; /* brand blue */
      color: #fff;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .hero button:hover {
      background: #16325F; /* darker shade */
    }

    /* Product Grid */
    .product-grid {
      padding: 40px 20px;
      background: rgba(255, 255, 255, 0.95);
      margin: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 120px; /* space so cards don’t get cut by footer */
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .product-card {
      flex: 1 1 200px;
      max-width: 220px;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .product-card:hover { transform: scale(1.05); }
    .product-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .product-card h4 { margin: 8px 0 4px; font-size: 16px; color: #23468C; }
    .product-card p { margin: 4px 0; font-size: 13px; color: #555; }

    /* Footer */
    .site-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 12px 0;
      font-size: 14px;
    }

    .site-footer p { margin: 4px 0; }

    /* Login Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
    }

    .modal-content {
      background: #fff;
      margin: 15% auto;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      animation: fadeIn 0.3s ease;
    }

    .modal-content h3 { margin-top: 0; }
    .modal-content input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .modal-content button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #23468C;
      color: #fff;
      cursor: pointer;
    }

    .modal-content button:hover { background: #16325F; }
    .close { float: right; font-size: 20px; cursor: pointer; }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">
      <img src="gglogo.png" alt="Golden Glow Logo">
      <span class="logo-text">Golden Glow</span>
    </div>
    <div class="search-bar"><input type="text" placeholder="search..."></div>
    <div class="nav-links">
      <a href="#about">About Us</a>
      <a href="#products">Products</a>
      <a href="#account" onclick="openLogin()">Account</a>
      <span class="cart" title="Cart">🛒</span>
    </div>
  </div>

  <!-- Hero Section -->
  <div class="hero">
    <h1>Buy Yours Now</h1>
    <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
      Shop Products
    </button>
  </div>

  <!-- Main Content -->
  <div id="products" class="product-grid">
    <h2 style="text-align:center; color:#23468C;">Products</h2>
    <div id="grid" class="row">
      <!-- Temporary Products -->
      <div class="product-card">
        <img src="https://via.placeholder.com/200x120" alt="Glow Cream">
        <h4>Glow Cream</h4>
        <p>$19.99</p>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/200x120" alt="Brightening Lotion">
        <h4>Brightening Lotion</h4>
        <p>$24.99</p>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/200x120" alt="Rejuvenating Toner">
        <h4>Rejuvenating Toner</h4>
        <p>$14.99</p>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/200x120" alt="Cleansing Foam">
        <h4>Cleansing Foam</h4>
        <p>$12.99</p>
      </div>
    </div>
  </div>

   <!-- Footer -->
  <footer class="site-footer">
    <p>© 2006 Golden Glow</p>
    <p>Find us at: Facebook | Twitter | Instagram | Email</p>
  </footer>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeLogin()">&times;</span>
      <h3>Login</h3>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()">Login</button>
    </div>
  </div>

  <script>
    function openLogin() {
      document.getElementById("loginModal").style.display = "block";
    }
    function closeLogin() {
      document.getElementById("loginModal").style.display = "none";
    }

    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user === "admin" && pass === "1234") {
        alert("Logged in as admin. Redirecting...");
        window.open("admin.html", "_blank");
      } else if (user === "user" && pass === "1234") {
        alert("Logged in as regular user.");
        closeLogin();
      } else {
        alert("Invalid credentials.");
      }
    }

    // Close modal if clicked outside
    window.onclick = function(event) {
      const modal = document.getElementById("loginModal");
      if (event.target === modal) {
        modal.style.display = "none";
      }
    }
  </script>
</body>
</html>
